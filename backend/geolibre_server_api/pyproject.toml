[project]
name = "geolibre-server-api"
version = "0.1.0"
description = "Reference GeoLibre projects and identity API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "sqlalchemy>=2.0", "uvicorn[standard]>=0.32"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
s3 = ["boto3>=1.35"]
test = ["httpx>=0.27", "pytest>=8"]

[project.scripts]
geolibre-server-api = "geolibre_server_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["geolibre_server_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
