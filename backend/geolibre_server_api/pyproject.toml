[project]
name = "geolibre-server-api"
version = "0.1.0"
description = "Reference GeoLibre projects and identity API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42",
  "fastapi>=0.115",
  "httpx>=0.27",
  "joserfc>=1.0",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
s3 = ["boto3>=1.35"]
migrations = ["alembic>=1.13"]
test = ["alembic>=1.13", "httpx>=0.27", "pytest>=8", "pytest-cov>=5.0.0"]

[project.scripts]
geolibre-server-api = "geolibre_server_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["geolibre_server_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "postgres: requires GEOLIBRE_TEST_POSTGRES_URL (disposable schema; identity concurrency gate)",
  "oidc_interop: requires GEOLIBRE_TEST_OIDC_ISSUER (real IdP at that issuer; CI interop job)",
]
addopts = "-m 'not postgres and not oidc_interop'"
