name = "geolibre-tiles"
main = "src/index.ts"
compatibility_date = "2025-03-01"

# Every route forwards bytes or small JSON, so a tight per-request CPU cap is
# plenty. Note: this knob only applies on paid plans.
[limits]
cpu_ms = 200

# Binds the custom domain on deploy. Because geolibre.app is managed in this
# Cloudflare account, the DNS record and TLS certificate are provisioned
# automatically on the first `wrangler deploy`.
[[routes]]
pattern = "tiles.geolibre.app"
custom_domain = true

# Scoped in src/index.ts to abuse-prone routes (/overpass, /firms/viirs/*,
# /github-raw, /earthdata/download) keyed by "<route>:<ip>", so lightweight
# tile, PMTiles range extraction, CCTV, and catalog traffic is never throttled
# and one route group cannot starve another behind a shared NAT.
[[ratelimits]]
name = "TILES_RATE_LIMITER"
namespace_id = "54703"

[ratelimits.simple]
limit = 600
period = 60

[observability]
enabled = true

[observability.logs]
head_sampling_rate = 0.05

[observability.traces]
enabled = true
head_sampling_rate = 0.01
