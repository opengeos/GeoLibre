[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geolibre"
dynamic = ["version"]
description = "GeoLibre in Jupyter: the full GeoLibre GIS app as an anywidget, with a leafmap-style Python API."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Qiusheng Wu", email = "giswqs@gmail.com" }]
keywords = ["geolibre", "gis", "maplibre", "jupyter", "anywidget", "mapping"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: Jupyter",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = ["anywidget>=0.9", "traitlets>=5", "jupyter-ui-poll>=0.2"]

[project.optional-dependencies]
# `all` is the union of the data extras. It now pulls in the raster stack
# (rasterio ships GDAL), so installs that only need GeoDataFrames and local
# vector files can ask for `vector` instead.
all = ["geopandas", "shapely", "xarray", "rioxarray", "rasterio"]
vector = ["geopandas", "shapely"]
raster = ["xarray", "rioxarray", "rasterio"]
# The MCP server (geolibre.mcp) is the only thing that imports the SDK, so it
# stays optional: the widget and the project builders work without it.
mcp = ["mcp>=2.0"]
dev = ["pytest", "build", "anywidget[dev]", "jupyter-server", "mcp>=2.0"]

[project.scripts]
# geolibre.mcp:main, not geolibre.mcp.server:main — the package-level wrapper
# turns a missing `mcp` extra into an actionable message instead of a traceback.
geolibre-mcp = "geolibre.mcp:main"

[project.urls]
Homepage = "https://geolibre.app"
Repository = "https://github.com/opengeos/GeoLibre"

[tool.hatch.version]
path = "src/geolibre/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/geolibre"]
# The bundled app under static/ is produced by the build hook and git-ignored,
# so it must be re-included explicitly here (VCS file discovery skips it).
artifacts = ["src/geolibre/static/**"]

# Install the Jupyter Server config drop-in to {sys.prefix}/etc/jupyter so the
# bundled app-serving extension (geolibre._load_jupyter_server_extension)
# auto-enables on `pip install geolibre`, including on managed JupyterHubs.
[tool.hatch.build.targets.wheel.shared-data]
"jupyter-config/jupyter_server_config.d/geolibre.json" = "etc/jupyter/jupyter_server_config.d/geolibre.json"

[tool.hatch.build.targets.sdist]
artifacts = ["src/geolibre/static/**"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
pythonpath = ["src"]
