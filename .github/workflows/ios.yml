name: iOS

# iOS builds run on published releases (matching release.yml / android.yml), not
# on every PR — the Rust cross-compile + Xcode archive is slow and needs a macOS
# runner. Use the manual "Run workflow" button (workflow_dispatch) to build on
# demand from any branch.
#
# NOTE: iOS cannot be cross-compiled from Linux, so this runs on macOS. Unlike
# Android — where a throwaway debug keystore makes every CI run installable — a
# device/App Store build REQUIRES an Apple Developer account (signing certificate
# + provisioning profile + team id). Without those secrets the job still runs a
# no-signing compile check so CI catches iOS build breakage; it just can't
# produce an installable .ipa.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      export_method:
        description: "IPA export method (needs signing secrets)"
        type: choice
        default: app-store-connect
        options:
          - app-store-connect # TestFlight / App Store upload
          - release-testing # ad-hoc: registered UDIDs only
          - debugging # development devices

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Apple bundle identifier, asserted after the build. Comes from
  # `identifier` in src-tauri/tauri.ios.conf.json, which overrides the desktop
  # `org.geolibre.desktop` for iOS only (same value Android uses — different
  # stores, so the shared reverse-DNS id is fine). Burned permanently on first
  # App Store Connect upload, so it is verified rather than trusted.
  EXPECTED_BUNDLE_ID: "org.geolibre.app"

jobs:
  build:
    name: Build iOS app
    # Apple Silicon macOS image; ships a recent Xcode + CocoaPods. Pin the major
    # image so a runner update can't silently change the Xcode/SDK under us.
    #
    # macos-14 does NOT work: `tauri ios init` generates an Xcode project in
    # object format 77, which only Xcode 16+ can open. That image's Xcode is
    # older, so the archive died before compiling anything with:
    #   The project 'geolibre-desktop' cannot be opened because it is in a
    #   future Xcode project file format (77).
    # The floor is therefore set by the Tauri CLI's generated project format,
    # not by our own code — re-check it when the Tauri CLI is bumped.
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select the newest available Xcode
        # The image default is not trusted: it moves under us on image updates,
        # and too-old is a hard failure (project format 77 needs Xcode 16+) while
        # too-old-but-openable is a *silent* one — App Store Connect rejects
        # uploads built against an SDK below its current floor, which would only
        # surface after a full archive. Pick the newest Xcode present and record
        # the version and SDK in the log so a rejected upload can be diagnosed
        # from the run rather than guessed at.
        run: |
          set -euo pipefail
          newest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$newest" ]; then
            echo "::error::No Xcode found on the runner"
            exit 1
          fi
          sudo xcode-select -s "$newest/Contents/Developer"

          version="$(xcodebuild -version | head -1 | awk '{print $2}')"
          major="${version%%.*}"
          if [ "$major" -lt 16 ]; then
            echo "::error::Xcode $version is too old — the generated project uses object format 77, which requires Xcode 16+. Use a newer runner image."
            exit 1
          fi
          echo "::notice::Using Xcode $version at $newest"
          xcodebuild -version
          xcodebuild -showsdks | grep -i "iOS" || true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust stable with iOS targets
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          # aarch64-apple-ios: real devices + the signed .ipa. The two simulator
          # triples back the no-signing compile check (aarch64-sim on Apple
          # Silicon runners; x86_64 kept for completeness).
          targets: >-
            aarch64-apple-ios,
            aarch64-apple-ios-sim,
            x86_64-apple-ios

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: apps/geolibre-desktop/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        # tauri-build reads frontendDist (../dist) at compile time and errors if
        # it's missing, so the web bundle must exist before `tauri ios` runs.
        run: npm run build
        env:
          VITE_GEE_OAUTH_CLIENT_ID: ${{ secrets.VITE_GEE_OAUTH_CLIENT_ID }}

      - name: Generate iOS project
        # gen/apple is not committed; regenerate it on the clean runner. The
        # Tauri CLI is resolved through the geolibre-desktop workspace. This also
        # picks up src-tauri/tauri.ios.conf.json (bundle id, drops the Python
        # backend). src-tauri/Info.ios.plist (the NSLocation usage string) is
        # *not* merged here — that happens during the `tauri ios build` step
        # below, which is why regenerating the project alone never shows it.
        working-directory: apps/geolibre-desktop
        run: npx tauri ios init

      - name: Sync the real app icons into the generated catalog
        # `tauri ios init` fills the asset catalog from cargo-mobile2's *template*
        # placeholder icon and ignores src-tauri/icons/ios. gen/apple is
        # git-ignored and regenerated every run, so without this every build
        # ships the placeholder — build 2.4.0 (5) reached App Store Connect that
        # way, because a wrong icon produces no build error anywhere. The script
        # also asserts no icon carries an alpha channel, which Apple rejects at
        # upload rather than at build time.
        run: ./scripts/sync-ios-app-icon.sh

      - name: Verify the iOS deployment target
        # Apple's floor, not ours: from Spring 2027 App Store Connect refuses any
        # upload whose MinimumOSVersion is below 15.0, and today it accepts the
        # build and answers with a warning email instead (ITMS-90068, which is how
        # 2.5.0 build 7 was found to still carry 14.0). A warning that arrives
        # after the upload is exactly the kind of failure this job asserts away.
        #
        # The value is NOT written by anything in this repo: it comes from
        # `bundle.iOS.minimumSystemVersion` in tauri.ios.conf.json, which the Tauri
        # CLI templates into the generated project.yml as XcodeGen's
        # `deploymentTarget.iOS` (-> IPHONEOS_DEPLOYMENT_TARGET -> the .app's
        # MinimumOSVersion). Omit the key and the CLI's own default (14.0) applies
        # silently. So the config is read as the source of truth, checked against
        # Apple's floor, and then compared with what `ios init` actually
        # generated: a CLI that stopped honoring the key would otherwise look
        # identical here and only surface as another warning email.
        run: |
          set -euo pipefail
          conf="apps/geolibre-desktop/src-tauri/tauri.ios.conf.json"
          project="apps/geolibre-desktop/src-tauri/gen/apple/project.yml"

          # `// empty` rather than `jq -e` so a removed or renamed key lands on
          # the message below instead of jq's bare "Error: null (null)". Invalid
          # JSON still fails the step through `set -e`, as it should.
          want="$(jq -r '.bundle.iOS.minimumSystemVersion // empty' "$conf")"
          if [ -z "$want" ]; then
            echo "::error::$conf does not set bundle.iOS.minimumSystemVersion, so the Tauri CLI's 14.0 default would apply (ITMS-90068)"
            exit 1
          fi

          # Component-wise dotted-version compare, exiting 0 when the configured
          # target is at or above the floor. Deliberately not `sort -V`: this
          # runs on macOS, whose sort is BSD rather than GNU, and a `-V` that
          # errored out would fail the step with the message below no matter what
          # the config actually says. awk behaves the same on both.
          floor="15.0"
          if ! awk -v want="$want" -v floor="$floor" 'BEGIN {
                n = split(want, a, "."); m = split(floor, b, ".")
                for (i = 1; i <= (n > m ? n : m); i++) {
                  if (a[i] + 0 != b[i] + 0) exit (a[i] + 0 < b[i] + 0)
                }
                exit 0
              }'; then
            echo "::error::$conf sets bundle.iOS.minimumSystemVersion to '$want', below Apple's $floor floor (ITMS-90068)"
            exit 1
          fi

          if [ ! -f "$project" ]; then
            echo "::error::No generated project.yml at $project"
            exit 1
          fi
          # Scoped to the `deploymentTarget:` block, resetting at the first line
          # that dedents back out of it, so an `iOS:` key elsewhere in the file
          # can never be read as this one. Parsed as text rather than YAML on
          # purpose: a YAML loader turns `15.0` into a float, and `15.10` would
          # come back out as `15.1`. tr strips quoting if the template emits any.
          got="$(awk '
            /^[[:space:]]*deploymentTarget:/ { depth = match($0, /[^[:space:]]/); inblock = 1; next }
            !inblock || /^[[:space:]]*$/ { next }
            match($0, /[^[:space:]]/) <= depth { inblock = 0; next }
            $1 == "iOS:" { print $2; exit }
          ' "$project" | tr -cd '0-9.')"
          if [ "$got" != "$want" ]; then
            echo "::error::Generated project.yml has deploymentTarget.iOS '$got', expected the configured '$want'. Did the Tauri CLI stop honoring bundle.iOS.minimumSystemVersion?"
            exit 1
          fi

          echo "::notice::iOS deployment target $want"
          # Handed to the IPA verify step so it asserts against the configured
          # value rather than a second hardcoded copy of it.
          echo "IOS_MIN_OS=$want" >> "$GITHUB_ENV"

      - name: Check for Apple signing secrets
        id: signing
        # `secrets` can't be used in a step-level `if:`, so presence is turned
        # into an output and gated on below. All three are required to sign: a
        # partial set would spend the whole archive and only then fail.
        #
        # The iOS cert/profile use APPLE_IOS_* names, deliberately distinct from
        # the release.yml macOS secrets (APPLE_CERTIFICATE / APPLE_CERTIFICATE_
        # PASSWORD): that identity is a *Developer ID Application* cert for the
        # notarized Homebrew build and cannot sign an iOS app — iOS needs its own
        # Apple Distribution cert + provisioning profile. Reusing the name would
        # feed the wrong cert/password in. APPLE_TEAM_ID *is* shared, though — the
        # Team ID is account-wide, not per-certificate — so it is reused as-is.
        env:
          APPLE_IOS_CERTIFICATE_BASE64: ${{ secrets.APPLE_IOS_CERTIFICATE_BASE64 }}
          APPLE_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "${APPLE_IOS_CERTIFICATE_BASE64:-}" ] \
            && [ -n "${APPLE_IOS_PROVISIONING_PROFILE_BASE64:-}" ] \
            && [ -n "${APPLE_TEAM_ID:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No complete Apple iOS signing secret set — building an unsigned compile check only (no installable .ipa). Set APPLE_IOS_CERTIFICATE_BASE64, APPLE_IOS_CERTIFICATE_PASSWORD, APPLE_IOS_PROVISIONING_PROFILE_BASE64 (and reuse the existing APPLE_TEAM_ID) to produce a signed build."
          fi

      # ---- No-signing path: prove the iOS build compiles ---------------------
      - name: Compile check (no signing)
        if: steps.signing.outputs.present != 'true'
        # Cross-compile the Tauri library for a real device target. This catches
        # iOS-specific breakage (a dependency that won't build for aarch64-apple-
        # ios, a bad cfg) without an Apple account. It deliberately stops short of
        # the Xcode archive, which needs a signing identity.
        working-directory: apps/geolibre-desktop/src-tauri
        run: cargo build --lib --release --target aarch64-apple-ios

      # ---- Signing path: import the identity, archive, export a signed .ipa ---
      - name: Import signing identity
        if: steps.signing.outputs.present == 'true'
        env:
          APPLE_IOS_CERTIFICATE_BASE64: ${{ secrets.APPLE_IOS_CERTIFICATE_BASE64 }}
          APPLE_IOS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_IOS_CERTIFICATE_PASSWORD }}
          APPLE_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          # A dedicated, throwaway keychain (random password) rather than the
          # login keychain, so the imported private key never lingers on the
          # runner beyond this job.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_pass="$(openssl rand -base64 24)"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          security create-keychain -p "$keychain_pass" "$keychain"
          # Auto-lock after 6h; keep unlocked for the archive.
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_pass" "$keychain"

          cert="$RUNNER_TEMP/cert.p12"
          echo "$APPLE_IOS_CERTIFICATE_BASE64" | base64 --decode > "$cert"
          security import "$cert" -k "$keychain" \
            -P "${APPLE_IOS_CERTIFICATE_PASSWORD:-}" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild
          rm -f "$cert"

          # Put the temp keychain on the search list so xcodebuild finds the
          # identity, and grant codesign non-interactive access to the key.
          security list-keychains -d user -s "$keychain" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$keychain_pass" "$keychain" >/dev/null

          # Install the provisioning profile where Xcode looks for it. Xcode 16+
          # reads UserData/Provisioning Profiles; older versions read the
          # MobileDevice path. Install to both so the job is not coupled to the
          # runner image's Xcode version.
          profile="$RUNNER_TEMP/geolibre.mobileprovision"
          echo "$APPLE_IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile"

          # The export step must name the profile, so read its identity out of
          # the decoded payload rather than hardcoding a name that would silently
          # drift from whatever profile the secret actually holds.
          plist="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$profile" > "$plist"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$plist")"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist")"
          rm -f "$plist"
          echo "PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$profile_uuid" >> "$GITHUB_ENV"

          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$profile" "$dir/$profile_uuid.mobileprovision"
          done
          rm -f "$profile"
          echo "::notice::Installed provisioning profile '$profile_name' ($profile_uuid)."

      # The archive and the export are deliberately two steps.
      #
      # `tauri ios build --export-method ...` cannot sign this project: the Xcode
      # project `tauri ios init` generates bakes CODE_SIGN_IDENTITY = "iPhone
      # Developer" into both configurations, so Xcode's automatic signing looks
      # for an *iOS App Development* profile no matter which export method is
      # requested — and then fails ("Your team has no devices from which to
      # generate a provisioning profile"). Installing an App Store profile above
      # does not help, because that changes which profile is available, not which
      # type Xcode goes looking for. Forcing CODE_SIGN_IDENTITY="Apple
      # Distribution" fails differently: Xcode refuses to mix an automatic
      # signing style with a manually specified identity.
      #
      # Archiving unsigned sidesteps the whole resolution problem, and the export
      # step then signs with the imported identity under an explicit *manual*
      # style. Distribution profiles do not enumerate devices, so no device has to
      # be registered to the team.
      - name: Archive (unsigned)
        if: steps.signing.outputs.present == 'true'
        working-directory: apps/geolibre-desktop
        env:
          VITE_GEE_OAUTH_CLIENT_ID: ${{ secrets.VITE_GEE_OAUTH_CLIENT_ID }}
        run: npx tauri ios build --no-sign

      - name: Stamp a unique build number
        if: steps.signing.outputs.present == 'true'
        # App Store Connect permanently consumes a CFBundleVersion per marketing
        # version, so every upload needs a new one. CFBundleVersion here would
        # otherwise be the tauri.conf.json version (2.4.0) on every run, and the
        # second upload of a given version would be refused.
        #
        # This is NOT done with `tauri ios build --build-number`: that *appends*
        # to the version, yielding e.g. "2.4.0.42" — four components, while
        # CFBundleVersion may contain at most three period-separated integers.
        # App Store Connect rejects that at upload (ITMS-90060), so the flag is
        # unusable here. Stamping the archive instead keeps the value inside the
        # three-component budget while rising forever.
        #
        # GITHUB_RUN_NUMBER alone is not enough: it is fixed for the lifetime of
        # a run, so re-running a run that already produced an uploaded IPA would
        # regenerate the same CFBundleVersion. GITHUB_RUN_ATTEMPT is appended on
        # re-runs (attempt 1 is left bare so the common case stays a single
        # integer), giving e.g. "42" then "42.2" — still at most three
        # components, and ordered the way App Store Connect compares them.
        #
        # Apple also requires each upload to sort *above* the last one consumed
        # for the same marketing version. The one hand-uploaded 2.4.0 build used
        # CFBundleVersion 2.4.0, and dotted-integer comparison makes any run
        # number from 3 up ("N" reads as N.0.0) beat it. The counter is already
        # past that, so it only ever climbs from here.
        #
        # Safe to edit the archive at this point: it was built unsigned, and the
        # export step below is what signs it, so the seal is computed over this
        # plist rather than invalidated by it. CFBundleShortVersionString — the
        # version users actually see — is deliberately left alone.
        run: |
          set -euo pipefail
          gen="apps/geolibre-desktop/src-tauri/gen/apple"
          # `|| true` so a missing directory falls through to the check below:
          # find exits non-zero, and under pipefail that would otherwise abort
          # the step with a bare failure instead of the message underneath.
          archive="$(find "$gen/build" -maxdepth 1 -name '*.xcarchive' | head -1 || true)"
          if [ -z "$archive" ]; then
            echo "::error::No .xcarchive produced under $gen/build"
            exit 1
          fi
          app="$(find "$archive/Products/Applications" -maxdepth 1 -name '*.app' | head -1 || true)"
          if [ -z "$app" ]; then
            echo "::error::No .app inside $archive"
            exit 1
          fi

          build="$GITHUB_RUN_NUMBER"
          if [ "${GITHUB_RUN_ATTEMPT:-1}" != "1" ]; then
            build="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          fi

          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $build" "$app/Info.plist"
          # Keep the archive's own summary metadata consistent; not fatal if the
          # key is absent in a future Xcode's archive layout.
          /usr/libexec/PlistBuddy -c "Set :ApplicationProperties:CFBundleVersion $build" \
            "$archive/Info.plist" 2>/dev/null || true

          short="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")"
          echo "::notice::Version $short, build $build"
          # Handed to the verify step so it asserts against what was actually
          # stamped rather than recomputing it and agreeing with itself.
          echo "IOS_BUILD_NUMBER=$build" >> "$GITHUB_ENV"
          echo "IOS_SHORT_VERSION=$short" >> "$GITHUB_ENV"

      - name: Export signed IPA
        if: steps.signing.outputs.present == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Passed via env, not interpolated into the run script, so a workflow
          # context expression can't be injected into the shell.
          EXPORT_METHOD: ${{ github.event.inputs.export_method || 'app-store-connect' }}
        run: |
          set -euo pipefail
          gen="apps/geolibre-desktop/src-tauri/gen/apple"

          archive="$(find "$gen/build" -maxdepth 1 -name '*.xcarchive' | head -1)"
          if [ -z "$archive" ]; then
            echo "::error::No .xcarchive produced under $gen/build"
            exit 1
          fi

          # The signing certificate has to match the profile type the export
          # method implies, or xcodebuild fails deep inside the export with an
          # opaque error.
          if [ "$EXPORT_METHOD" = "debugging" ]; then
            cert="Apple Development"
          else
            cert="Apple Distribution"
          fi

          # Built with PlistBuddy rather than a heredoc so the values are encoded
          # by a plist writer instead of pasted into raw XML. PROFILE_NAME comes
          # from the Developer portal and is free text: a display name like
          # "GeoLibre R&D" would produce malformed XML by string interpolation,
          # and xcodebuild would reject the options file with an unhelpful parse
          # error rather than pointing at the name.
          opts="$RUNNER_TEMP/ExportOptions.plist"
          rm -f "$opts"
          plutil -create xml1 "$opts"
          /usr/libexec/PlistBuddy \
            -c "Add :method string $EXPORT_METHOD" \
            -c "Add :teamID string $APPLE_TEAM_ID" \
            -c "Add :signingStyle string manual" \
            -c "Add :signingCertificate string $cert" \
            -c "Add :uploadSymbols bool true" \
            -c "Add :provisioningProfiles dict" \
            -c "Add :provisioningProfiles:$EXPECTED_BUNDLE_ID string $PROFILE_NAME" \
            "$opts"
          plutil -lint "$opts"

          # Carried to the verify step so it can assert the *shipped* signature
          # matches the certificate this export actually asked for.
          echo "SIGNING_CERT=$cert" >> "$GITHUB_ENV"

          # APPLE_IOS_PROVISIONING_PROFILE_BASE64 must hold a *manually managed*
          # profile created in the Developer portal. An Xcode-managed one (the
          # kind Xcode generates itself, named "iOS Team Store Provisioning
          # Profile: ...") is rejected here with:
          #   Provisioning profile "..." is Xcode managed, but signing settings
          #   require a manually managed profile.
          # Likewise the .p12 must be an Apple Distribution certificate; a
          # cloud-managed signing identity is not exportable and will surface as
          # 'No signing certificate "iOS Distribution" found'.
          #
          # No -allowProvisioningUpdates: signing assets come from the secrets,
          # and the runner has no Apple account session to create them with. If
          # something is missing this must fail loudly rather than silently
          # reach out to Apple.
          xcodebuild -exportArchive \
            -archivePath "$archive" \
            -exportOptionsPlist "$opts" \
            -exportPath "$gen/build/export"

      - name: Verify the signed IPA
        if: steps.signing.outputs.present == 'true'
        # Assert on the shipped bytes, not the config: the App Store burns the
        # bundle id from the .ipa on first upload and it can never be changed, so
        # it is checked rather than assumed (mirrors android.yml's package-id
        # gate).
        #
        # The path is pinned to the export directory rather than searched for.
        # The unsigned archive step also leaves an .ipa behind (under
        # build/arm64), so a `find ... | head -1` here could pick the *unsigned*
        # one and upload something that cannot be submitted.
        run: |
          set -euo pipefail
          gen="apps/geolibre-desktop/src-tauri/gen/apple"
          ipa="$(find "$gen/build/export" -maxdepth 1 -name '*.ipa' | head -1)"
          if [ -z "$ipa" ]; then
            echo "::error::No .ipa produced under $gen/build/export"
            exit 1
          fi

          workdir="$(mktemp -d)"
          unzip -o -q "$ipa" -d "$workdir"
          app="$(find "$workdir/Payload" -maxdepth 1 -name '*.app' | head -1)"
          plist="$app/Info.plist"

          bid="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")"
          if [ "$bid" != "$EXPECTED_BUNDLE_ID" ]; then
            echo "::error::$ipa has bundle id '$bid', expected '$EXPECTED_BUNDLE_ID'"
            exit 1
          fi

          # An unsigned .ipa is structurally valid and passes every check above,
          # so signing is verified explicitly — otherwise the failure surfaces at
          # App Store Connect upload time, the most expensive place to find it.
          # --deep because App Store validation is itself deep: without it only
          # the outer bundle's seal is checked, and an unsigned or mismatched
          # nested binary would pass here and still be rejected at upload.
          if ! codesign --verify --deep --strict "$app" 2>/dev/null; then
            echo "::error::$ipa failed codesign verification"
            exit 1
          fi

          # Asserted against the certificate the export step actually requested,
          # not merely "some Apple identity". A distribution build that came out
          # signed for development is not submittable, and accepting either kind
          # here would let that through to fail at upload instead.
          authority="$(codesign -dvvv "$app" 2>&1 | grep '^Authority=' | head -1 | cut -d= -f2-)"
          case "$authority" in
            "$SIGNING_CERT"*) ;;
            *)
              echo "::error::$ipa signed by '$authority', expected '$SIGNING_CERT'"
              exit 1
              ;;
          esac

          if [ ! -f "$app/embedded.mobileprovision" ]; then
            echo "::error::$ipa has no embedded provisioning profile"
            exit 1
          fi

          # CFBundleVersion must be at most three period-separated integers or
          # App Store Connect rejects the upload (ITMS-90060) — after the whole
          # build. Assert the shape here, where it costs nothing.
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")"
          if ! printf '%s' "$build" | grep -qE '^[0-9]+(\.[0-9]+){0,2}$'; then
            echo "::error::CFBundleVersion '$build' is not at most three period-separated integers; App Store Connect will reject it"
            exit 1
          fi
          if [ "$build" != "$IOS_BUILD_NUMBER" ]; then
            echo "::error::CFBundleVersion is '$build', expected the stamped '$IOS_BUILD_NUMBER'"
            exit 1
          fi

          # The marketing version is never stamped, only carried through from
          # tauri.conf.json — so assert it survived export unchanged rather than
          # trusting that nothing rewrote the plist between archive and IPA.
          short="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")"
          if [ "$short" != "$IOS_SHORT_VERSION" ]; then
            echo "::error::CFBundleShortVersionString is '$short', expected '$IOS_SHORT_VERSION'"
            exit 1
          fi

          # The deployment target was checked against the generated project.yml
          # before the archive; this asserts it survived into the shipped bytes,
          # which is the copy App Store Connect reads for ITMS-90068.
          minos="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$plist")"
          if [ "$minos" != "$IOS_MIN_OS" ]; then
            echo "::error::$ipa has MinimumOSVersion '$minos', expected the configured '$IOS_MIN_OS'"
            exit 1
          fi

          echo "IPA $ipa: bundle id $EXPECTED_BUNDLE_ID, version $short ($build), min iOS $minos, signed by $authority."
          echo "IPA_PATH=$ipa" >> "$GITHUB_ENV"

      - name: Clean up the signing keychain
        # Runs even on failure so the imported key never outlives the job.
        if: always() && steps.signing.outputs.present == 'true'
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -f "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
          # Mirrors both install locations above, keyed by UUID. Guarded because
          # this runs on failure too, possibly before PROFILE_UUID was set.
          if [ -n "${PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision" || true
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$PROFILE_UUID.mobileprovision" || true
          fi

      - name: Upload signed IPA
        if: steps.signing.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: geolibre-ios-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 14
