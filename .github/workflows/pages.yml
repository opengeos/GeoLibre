name: Deploy Website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build website and demo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt
            apps/geolibre-desktop/jupyterlite/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Install JupyterLite build dependencies
        # Lets the web build's `prebuild` hook generate the self-hosted
        # JupyterLite site (served in the Notebook panel); without these the step
        # skips and the demo's notebook 404s on the published site.
        run: python -m pip install -r apps/geolibre-desktop/jupyterlite/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Resolve the analytics measurement ID
        id: analytics
        # One validated value for both builds below. A bare `!= ''` test would
        # hand the documentation `provider: google` for anything non-empty,
        # including a value the app's own resolveAnalyticsId rejects (a GTM
        # container id, a stray quote), leaving the site loading a tag that
        # reports nowhere. Same shape the app enforces, so a mistyped repository
        # variable fails here instead: see MEASUREMENT_ID_PATTERN in
        # apps/geolibre-desktop/src/lib/analytics.ts.
        env:
          # Accepted as either a repository variable or a secret, the way
          # VITE_MAPILLARY_ACCESS_TOKEN is below: a GA4 measurement ID is public
          # by construction (it ships in the page source), so a variable is the
          # natural home, but it is a reasonable thing to have typed into the
          # secrets page and there is no reason to reject it there. Supplied as
          # a secret it is masked in this job's log, so the step reports "***"
          # rather than the ID.
          RAW_MEASUREMENT_ID: ${{ secrets.GEOLIBRE_GA_MEASUREMENT_ID || vars.GEOLIBRE_GA_MEASUREMENT_ID }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          # Trim the ends only, the way the app's own resolveAnalyticsId does.
          # Deleting *all* whitespace would quietly repair "G-AB CD1234" into a
          # value that passes, which is the paste error this step exists to
          # catch. The bash regex matches the whole string, so an embedded
          # newline fails it rather than matching one line of several.
          id=$(printf '%s' "${RAW_MEASUREMENT_ID:-}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | tr '[:lower:]' '[:upper:]')
          if [ -n "$id" ] && [[ ! $id =~ ^G-[A-Z0-9]{4,24}$ ]]; then
            echo "::error::GEOLIBRE_GA_MEASUREMENT_ID is not a GA4 measurement ID (G-...)."
            exit 1
          fi
          # A pull_request run builds the same site as a check but publishes
          # nothing, and analytics from an unpublished build would be noise.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            id=""
          fi
          if [ -n "$id" ]; then
            echo "Analytics enabled for $id."
            provider=google
          else
            echo "Analytics disabled (no measurement ID for this run)."
            provider=""
          fi
          {
            echo "measurement_id=$id"
            echo "provider=$provider"
          } >> "$GITHUB_OUTPUT"

      - name: Build web demo
        run: npm run build -w geolibre-desktop
        env:
          GEOLIBRE_APP_BASE: ./
          VITE_GEE_OAUTH_CLIENT_ID: ${{ secrets.VITE_GEE_OAUTH_CLIENT_ID }}
          # Protomaps API key, baked into the client bundle so the New map
          # dialog can offer Protomaps basemaps. When unset, those options are
          # hidden (see getProtomapsStyleUrl in @geolibre/core).
          VITE_PROTOMAPS_API_KEY: ${{ secrets.VITE_PROTOMAPS_API_KEY }}
          # Google Photorealistic 3D Tiles and Google Street View use the same
          # Maps key. Prefer the Vite-prefixed secret name, but also pass the
          # bare name below so vite.config.ts can expose local/CI test setups.
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          # Mapillary access token, baked into the client bundle so the
          # Mapillary/Street View plugins work without each visitor pasting a
          # token. It ends up publicly readable in the served JS, so it is not a
          # true secret; a repo variable works as well as a secret here.
          VITE_MAPILLARY_ACCESS_TOKEN: ${{ secrets.VITE_MAPILLARY_ACCESS_TOKEN || vars.VITE_MAPILLARY_ACCESS_TOKEN }}
          # Public relay URL (baked into the client bundle), not a secret. Lights
          # up live collaboration; requires the workers/collab relay to be
          # deployed (see docs/collaboration.md).
          VITE_GEOLIBRE_COLLAB_URL: wss://collab.geolibre.app
          # Google Analytics measurement ID for the demo app served under
          # geolibre.app/demo/, so it reports to the same stream as the
          # documentation pages around it. Empty (the default, including on
          # every fork and on pull_request runs) ships no tracker; see the
          # resolve step above and analytics.ts.
          VITE_GEOLIBRE_GA_MEASUREMENT_ID: ${{ steps.analytics.outputs.measurement_id }}

      - name: Build documentation
        run: zensical build --strict
        env:
          # Same measurement ID for the documentation itself. `provider` is a
          # separate variable the theme keys its analytics partial off; it is
          # derived by the resolve step rather than configured, so setting the
          # one repository variable GEOLIBRE_GA_MEASUREMENT_ID turns the whole
          # site on. See the extra.analytics block in mkdocs.yml.
          GEOLIBRE_ANALYTICS_PROVIDER: ${{ steps.analytics.outputs.provider }}
          GEOLIBRE_GA_MEASUREMENT_ID: ${{ steps.analytics.outputs.measurement_id }}

      - name: Add web demo to site
        run: |
          mkdir -p site/demo
          cp -R apps/geolibre-desktop/dist/. site/demo/
          test -f site/demo/index.html
          test -f site/demo/jupyterlite/lab/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
