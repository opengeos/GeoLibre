name: Build Mac App Store package

# Builds the sandboxed Mac App Store variant and produces the signed .pkg for
# submission via Transporter or `xcrun altool --upload-app`. It runs on each
# published release (matching release.yml / android.yml / ios.yml) and on demand
# via the "Run workflow" button, and publishes the .pkg both as a workflow
# artifact and — on release runs — as a release asset.
#
# That release asset is the *submission* package, not a download: a MAS-signed
# .pkg is installable only through the App Store, so a user who grabs it from
# the releases page cannot run it. It is attached so the exact bytes submitted
# for a given tag stay recoverable after the CI artifact expires. macOS users
# install GeoLibre from the App Store, the Homebrew cask, or the Developer
# ID-signed .dmg that release.yml attaches.
#
# The MAS variant differs from the Developer ID builds in release.yml:
#   - `mas` cargo feature: the Python sidecar, Jupyter, martin, and external
#     plugin installation are compiled out (App Sandbox forbids spawning
#     downloaded executables; guideline 2.5.2 forbids downloading executable
#     code). Client-side engines (DuckDB-WASM, Whitebox WASM, Turf, Pyodide)
#     keep working because WebKit executes them.
#   - App Sandbox entitlements + embedded provisioning profile
#     (tauri.mas.conf.json), signed with "Apple Distribution" instead of
#     "Developer ID Application"; no notarization (not applicable to MAS).
#   - GEOLIBRE_STORE_BUILD=1 strips the in-app update flow (set by
#     scripts/tauri-build.mjs --mas), matching Apple guideline 2.4.5(vii).
#
# Required secrets (see docs/mac-app-store.md for how to create them):
#   APPLE_MAS_CERTIFICATE            base64 .p12 holding BOTH the
#                                    "Apple Distribution" and the
#                                    "3rd Party Mac Developer Installer"
#                                    certificates with their private keys
#   APPLE_MAS_CERTIFICATE_PASSWORD   password of that .p12
#   APPLE_MAS_SIGNING_IDENTITY       e.g. "Apple Distribution: Name (TEAMID)"
#   APPLE_MAS_INSTALLER_IDENTITY     e.g. "3rd Party Mac Developer Installer: Name (TEAMID)"
#   APPLE_MAS_PROVISIONING_PROFILE   base64 Mac App Store .provisionprofile
#                                    for org.geolibre.desktop
#   APPLE_TEAM_ID                    already configured for release.yml

on:
  release:
    types: [published]
  workflow_dispatch:

# Least privilege at the workflow level; the build job below elevates to
# contents: write only where it needs to attach the release asset.
permissions:
  contents: read

# A release run must never be cancelled: it is the only producer of that tag's
# release assets, and losing it mid-upload leaves the release incomplete with no
# obvious sign of why. So the group separates release runs from manual ones (a
# workflow_dispatch on the same tag would otherwise share the group and cancel
# the release build), and cancel-in-progress is disabled for release runs
# outright. Manual runs still supersede each other, which is what you want while
# iterating.
concurrency:
  group: mas-store-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  # Split out of `build` so a release run with no MAS secrets skips the whole
  # macOS job rather than gating a dozen steps individually — and, more to the
  # point, so it does not redden an otherwise good release. A workflow_dispatch
  # run is an explicit request for a .pkg, so there the same missing secrets are
  # a hard error instead.
  secrets-gate:
    name: Check signing secrets
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - name: Verify signing secrets are configured
        id: check
        env:
          APPLE_MAS_CERTIFICATE: ${{ secrets.APPLE_MAS_CERTIFICATE }}
          APPLE_MAS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_MAS_CERTIFICATE_PASSWORD }}
          APPLE_MAS_PROVISIONING_PROFILE: ${{ secrets.APPLE_MAS_PROVISIONING_PROFILE }}
          APPLE_MAS_SIGNING_IDENTITY: ${{ secrets.APPLE_MAS_SIGNING_IDENTITY }}
          APPLE_MAS_INSTALLER_IDENTITY: ${{ secrets.APPLE_MAS_INSTALLER_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          missing=()
          for name in APPLE_MAS_CERTIFICATE APPLE_MAS_CERTIFICATE_PASSWORD \
            APPLE_MAS_PROVISIONING_PROFILE APPLE_MAS_SIGNING_IDENTITY \
            APPLE_MAS_INSTALLER_IDENTITY APPLE_TEAM_ID; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} == 0 )); then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=false" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "::error::Missing secrets for the Mac App Store build: ${missing[*]}. See docs/mac-app-store.md."
            exit 1
          fi
          # The whole set is unavailable to forks, and a repo that has not set
          # them up yet should not get a red release. Warn and skip.
          echo "::warning::Skipping the Mac App Store package for this release — missing secrets: ${missing[*]}. See docs/mac-app-store.md."

  build:
    name: Build MAS pkg
    runs-on: macos-latest
    needs: secrets-gate
    # success() is explicit because a custom job `if:` REPLACES the default
    # success() check on `needs:` rather than ANDing with it. Without it, this
    # job's gating would rest on the invariant that secrets-gate writes
    # present=false before any path that fails the step — true today, but not
    # something Actions enforces against a future edit.
    if: success() && needs.secrets-gate.outputs.present == 'true'
    # Elevated here (not workflow-level) so only this job can write release
    # assets; workflow_dispatch runs never attach but the grant is harmless.
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # npm ci runs third-party lifecycle scripts; keep the checkout token
          # out of the local git config they could read.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/geolibre-desktop/jupyterlite/requirements.txt

      - name: Install JupyterLite build dependencies
        # Unlike the other desktop builds, the sandboxed Store build cannot
        # spawn a JupyterLab server, so its Notebook panel embeds the
        # self-hosted JupyterLite site and the `prebuild` hook must be able to
        # generate it. Without these the build fails at that guard rather than
        # shipping a Notebook panel that renders a second copy of the app.
        run: python -m pip install -r apps/geolibre-desktop/jupyterlite/requirements.txt

      - name: Install Rust stable
        # Pinned to a commit SHA (not the moving `stable` branch) because this
        # job later holds the App Store signing certificates in its keychain.
        # Update deliberately when bumping the toolchain action.
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install universal-build Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Import signing certificates into a temporary keychain
        env:
          APPLE_MAS_CERTIFICATE: ${{ secrets.APPLE_MAS_CERTIFICATE }}
          APPLE_MAS_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_MAS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/mas-signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$APPLE_MAS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/mas.p12"
          security import "$RUNNER_TEMP/mas.p12" -k "$keychain" \
            -P "$APPLE_MAS_CERTIFICATE_PASSWORD" -f pkcs12 -A \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          rm "$RUNNER_TEMP/mas.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          echo "MAS_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Install the provisioning profile and render entitlements
        env:
          APPLE_MAS_PROVISIONING_PROFILE: ${{ secrets.APPLE_MAS_PROVISIONING_PROFILE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          printf '%s' "$APPLE_MAS_PROVISIONING_PROFILE" | base64 --decode \
            > apps/geolibre-desktop/src-tauri/mas/embedded.provisionprofile
          scripts/render-mas-entitlements.sh

      - name: Build the sandboxed universal app
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_GEE_OAUTH_CLIENT_ID: ${{ secrets.VITE_GEE_OAUTH_CLIENT_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_MAS_SIGNING_IDENTITY }}
        run: npm run tauri:build:mas -- --target universal-apple-darwin

      - name: Build the signed installer package
        id: build_pkg
        env:
          APPLE_MAS_INSTALLER_IDENTITY: ${{ secrets.APPLE_MAS_INSTALLER_IDENTITY }}
        run: |
          app="apps/geolibre-desktop/src-tauri/target/universal-apple-darwin/release/bundle/macos/GeoLibre Desktop.app"
          [[ -d "$app" ]] || { echo "::error::No app bundle at $app"; exit 1; }
          # Confirm the sandbox entitlement made it into the signature before
          # packaging; an unsandboxed binary is an automatic App Review reject.
          entitlements="$(codesign -d --entitlements - --xml "$app")" \
            || { echo "::error::codesign could not read entitlements from $app"; exit 1; }
          grep -q "com.apple.security.app-sandbox" <<<"$entitlements" \
            || { echo "::error::App bundle is missing the app-sandbox entitlement"; exit 1; }
          # App Review rejected 2.4.0 (guideline 2.4.5) for shipping
          # network.server without matching functionality. The app now makes
          # only outgoing connections — the Earth Engine OAuth loopback listener
          # is compiled out of the `mas` build — so this entitlement must stay
          # gone. If a future feature genuinely needs to accept an inbound
          # connection, re-add it here AND justify it in App Review Information.
          if grep -q "com.apple.security.network.server" <<<"$entitlements"; then
            echo "::error::App bundle carries com.apple.security.network.server; App Review rejects it without an inbound-connection feature (see mas/Entitlements.mas.plist.template)"
            exit 1
          fi
          version="$(node -p "require('./apps/geolibre-desktop/src-tauri/tauri.conf.json').version")"
          pkg="GeoLibre.Desktop_${version}_universal_mas.pkg"
          xcrun productbuild --sign "$APPLE_MAS_INSTALLER_IDENTITY" \
            --component "$app" /Applications "$pkg"
          echo "pkg_path=$pkg" >> "$GITHUB_OUTPUT"

      - name: Upload MAS package artifact
        uses: actions/upload-artifact@v7
        with:
          name: geolibre-mas-pkg
          path: ${{ steps.build_pkg.outputs.pkg_path }}
          if-no-files-found: error

      - name: Attach MAS package to GitHub Release
        # Release runs only; a workflow_dispatch build has no release to attach
        # to and stops at the artifact above. The `_mas` suffix in the filename
        # is load-bearing — see the header comment: this .pkg installs only via
        # the App Store, so it must not be mistaken for the Developer ID .dmg
        # that release.yml publishes alongside it.
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          PKG_PATH: ${{ steps.build_pkg.outputs.pkg_path }}
        run: gh release upload "$TAG" "$PKG_PATH" --clobber

      - name: Remove the temporary keychain
        if: always()
        run: |
          if [[ -n "${MAS_KEYCHAIN:-}" && -f "$MAS_KEYCHAIN" ]]; then
            security delete-keychain "$MAS_KEYCHAIN"
          fi
