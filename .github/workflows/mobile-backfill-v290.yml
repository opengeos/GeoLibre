# TEMPORARY - delete once v2.9.0 has its Android and iOS assets.
#
# v2.9.0 published without an Android APK or AAB and without an iOS .ipa.
# `focus_main_window` in `src-tauri/src/lib.rs` called `window.unminimize()`,
# which is desktop-only in Tauri v2, so both aarch64-linux-android and
# aarch64-apple-ios failed to compile and neither release run reached its
# upload step. The fix is a `#[cfg(desktop)]` gate, but it landed after the
# tag, so re-running the release event is not an option.
#
# `android.yml` and `ios.yml` attach assets only on a `release` event. This
# workflow takes the artifacts an ordinary run of those workflows produces and
# attaches them to an existing release instead. Two steps:
#
#   1. Build from a ref that contains the fix, and wait for both to finish:
#        gh workflow run android.yml -R opengeos/GeoLibre --ref main
#        gh workflow run ios.yml     -R opengeos/GeoLibre --ref main
#      Both sign exactly as a release run does: the signing path keys off the
#      presence of the signing secrets, not the event name, and ios.yml's
#      export_method already defaults to app-store-connect on a manual run.
#
#   2. Attach, leaving the run ids blank to take the most recent successful run
#      of each workflow:
#        gh workflow run mobile-backfill-v290.yml -R opengeos/GeoLibre
#
# The binaries come from `main` rather than from the v2.9.0 tag, because the tag
# does not compile for mobile. At the time of writing those differ only by the
# one-line mobile compile fix, and tauri.conf.json still reads 2.9.0, so they
# version as 2.9.0. Check that main has not moved further before running this;
# if it has, build from a ref that is v2.9.0 plus the fix instead.
#
# Delete this file once the v2.9.0 release carries its .apk, .aab, and .ipa.
name: Attach mobile builds to v2.9.0 (temporary)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the mobile assets to
        required: true
        default: v2.9.0
      platform:
        description: Which platforms to backfill
        type: choice
        default: both
        options:
          - both
          - android
          - ios
      android_run_id:
        description: >-
          android.yml run to take artifacts from. Blank uses the most recent
          successful run.
        required: false
        default: ""
      ios_run_id:
        description: >-
          ios.yml run to take artifacts from. Blank uses the most recent
          successful run.
        required: false
        default: ""

permissions:
  contents: read

jobs:
  android:
    name: Attach Android APKs and AAB to ${{ inputs.tag }}
    if: inputs.platform == 'both' || inputs.platform == 'android'
    runs-on: ubuntu-22.04
    permissions:
      # Upload release assets, and read artifacts from the android.yml run.
      contents: write
      actions: read
    steps:
      - name: Resolve the android.yml run
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.android_run_id }}
        run: |
          set -euo pipefail
          if [ -n "$RUN_ID" ]; then
            resolved="$RUN_ID"
          else
            resolved="$(gh run list -R "$REPO" \
              --workflow android.yml --status success --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty')"
          fi
          if [ -z "$resolved" ]; then
            echo "::error::No successful android.yml run found. Build one first: gh workflow run android.yml --ref main"
            exit 1
          fi
          echo "run_id=$resolved" >> "$GITHUB_OUTPUT"
          gh run view -R "$REPO" "$resolved" \
            --json displayTitle,headBranch,headSha,conclusion \
            --jq '"Using android.yml run \(.displayTitle) on \(.headBranch) @ \(.headSha[0:7]) (\(.conclusion))"'

      - name: Warn if the release already has Android assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          existing="$(gh release view "$TAG" -R "$REPO" --json assets \
            --jq '[.assets[].name | select(endswith(".apk") or endswith(".aab"))] | join(", ")')"
          if [ -n "$existing" ]; then
            echo "::warning::$TAG already carries Android assets ($existing); they will be overwritten."
          fi

      - name: Download the signed APKs
        uses: actions/download-artifact@v7
        with:
          name: geolibre-android-release-apks
          path: apks
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the Play AAB
        # Only release-keystore runs produce an AAB. If this step fails, the
        # android.yml run was debug-signed and must not be published at all.
        uses: actions/download-artifact@v7
        with:
          name: geolibre-android-play-aab
          path: aab
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          ls -l apks aab
          gh release upload "$TAG" -R "$REPO" apks/*.apk aab/*.aab --clobber

  ios:
    name: Attach iOS IPA to ${{ inputs.tag }}
    if: inputs.platform == 'both' || inputs.platform == 'ios'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Resolve the ios.yml run
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.ios_run_id }}
        run: |
          set -euo pipefail
          if [ -n "$RUN_ID" ]; then
            resolved="$RUN_ID"
          else
            resolved="$(gh run list -R "$REPO" \
              --workflow ios.yml --status success --limit 1 \
              --json databaseId --jq '.[0].databaseId // empty')"
          fi
          if [ -z "$resolved" ]; then
            echo "::error::No successful ios.yml run found. Build one first: gh workflow run ios.yml --ref main"
            exit 1
          fi
          echo "run_id=$resolved" >> "$GITHUB_OUTPUT"
          gh run view -R "$REPO" "$resolved" \
            --json displayTitle,headBranch,headSha,conclusion \
            --jq '"Using ios.yml run \(.displayTitle) on \(.headBranch) @ \(.headSha[0:7]) (\(.conclusion))"'

      - name: Warn if the release already has an iOS asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          existing="$(gh release view "$TAG" -R "$REPO" --json assets \
            --jq '[.assets[].name | select(endswith(".ipa"))] | join(", ")')"
          if [ -n "$existing" ]; then
            echo "::warning::$TAG already carries an iOS asset ($existing); it will be overwritten."
          fi

      - name: Download the signed IPA
        # An unsigned compile-check run uploads no artifact at all, so this step
        # failing means the ios.yml run had no signing secrets and produced
        # nothing publishable.
        uses: actions/download-artifact@v7
        with:
          name: geolibre-ios-ipa
          path: ipa
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          ls -l ipa
          src="$(find ipa -name '*.ipa' | head -1)"
          if [ -z "$src" ]; then
            echo "::error::No .ipa in the geolibre-ios-ipa artifact"
            exit 1
          fi
          # Match the name a release run would have produced. xcodebuild names
          # the export after the Xcode product ("geolibre-desktop.ipa"), which
          # says nothing about the version or that this is the App Store build,
          # and release assets are permanent and world-visible.
          #
          # ios.yml derives the version from the built app's
          # CFBundleShortVersionString; here it comes from the tag. Those agree
          # only while the ref you built from still has that version in
          # tauri.conf.json, which is the same assumption the header calls out
          # for the binaries themselves. Confirm it before running this.
          version="${TAG#v}"
          asset="GeoLibre_${version}_ios_app-store.ipa"
          cp "$src" "$asset"
          gh release upload "$TAG" -R "$REPO" "$asset" --clobber

      - name: Report the attached assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" -R "$REPO" --json assets \
            --jq '.assets[] | select(.name | endswith(".apk") or endswith(".aab") or endswith(".ipa")) | "  \(.name) (\(.size) bytes)"'
