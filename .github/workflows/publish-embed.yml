name: Publish embed SDK

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm trusted publishing and provenance.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted Publishing (OIDC) requires npm >= 11.5.1, which the runner's
      # bundled npm is not guaranteed to be. Pin to a known-good version rather
      # than `npm@latest`: that tag briefly shipped a build missing the bundled
      # `sigstore` module, which breaks `npm publish --provenance`.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@11.5.1

      - run: npm ci
      - id: version
        run: |
          version=$(node -p "require('./packages/embed/package.json').version")
          if npm view "@geolibre/embed@$version" version >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      # No NODE_AUTH_TOKEN: npm authenticates via the OIDC id-token from the
      # trusted publisher configured on the package (opengeos/GeoLibre, this
      # workflow file) and attaches build provenance. npm has no PyPI-style
      # pending publisher, so the package has to exist before that connection
      # can be made: version 2.4.0 is published from a maintainer's machine
      # once, then every later release goes through here.
      - name: Publish to npm (Trusted Publishing)
        if: steps.version.outputs.publish == 'true'
        run: npm publish -w @geolibre/embed --provenance --access public
