# Cache policy for the self-hosted JupyterLite site (the /jupyterlite/ location
# below). Most of that site by weight is webpack output whose filename carries a
# content hash (`build/1053.75981ec.js`, `.../remoteEntry.<hash>.js`) -- ~276
# files, ~12 MB of a 58 MB build -- but because that location claims the whole
# prefix, none of it reaches the immutable-asset location at the bottom of this
# file. So the split `location /` already makes ("revalidate the entrypoint,
# cache the hashed assets forever") is restated here for the prefix.
#
# A map rather than a nested location because add_header does not inherit into a
# block that sets any header of its own: a nested location would have to restate
# the whole /jupyterlite/ CSP as well, leaving two copies of a long policy to
# drift apart. This way one add_header covers both cases and the headers around
# it are untouched.
#
# Matching the hash rather than the extension is deliberate: the build also
# emits ~80 static files whose names are stable across rebuilds --
# service-worker.js, lab/bundle.js, bootstrap.js, the bundled themes'
# index.js/index.css, the MathJax and FontAwesome fonts. Pinning those for a
# year would strand a stale service worker and stale bundles after a redeploy,
# exactly what the `location = /sw.js` block below exists to prevent, so they
# fall to the revalidating default. The leading `[./-]` (or the `/` before a
# bare-hash filename) keeps the hex run from matching an ordinary word; no
# stable name in the build output is seven or more hex characters long.
map $uri $geolibre_jupyterlite_cache {
    default "no-cache, must-revalidate";
    "~*^/jupyterlite/.*[./-][0-9a-f]{7,}\.(?:css|js|mjs|png|jpg|jpeg|gif|ico|svg|webp|avif|wasm|woff2?|ttf|otf|eot)$" "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Optional HTTP Basic Auth. entrypoint.sh rewrites this snippet on every
    # container start: when GEOLIBRE_AUTH_USER/GEOLIBRE_AUTH_PASSWORD are set
    # it enables auth_basic with a generated htpasswd, otherwise it leaves the
    # snippet empty (no auth, the default). Living at server level, the
    # directives inherit into every location below, including the /sidecar/
    # proxy. Basic Auth sends credentials with each request, so pair it with
    # TLS (a reverse proxy in front) on anything but a trusted network.
    include /etc/nginx/geolibre-auth.conf;

    # Optional authenticated AI reverse proxy. entrypoint.sh writes a location
    # block here only when GEOLIBRE_AI_URL, GEOLIBRE_AI_PROXY_URL, and
    # GEOLIBRE_AI_PROXY_TOKEN are all configured. The browser calls the
    # same-origin /ai route; nginx injects the server-only instance token.
    include /etc/nginx/geolibre-ai-proxy.conf;

    # Unauthenticated health endpoint for the container HEALTHCHECK (and any
    # external monitor). Must stay outside auth or enabling a password would
    # flip the container to unhealthy.
    location = /healthz {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
    gzip_min_length 1024;

    # Reverse-proxy the optional Python sidecar bundled in the same image. The
    # trailing slash strips the /sidecar/ prefix, so /sidecar/conversion/status
    # reaches the sidecar at /conversion/status. Being same-origin avoids CORS.
    location /sidecar/ {
        proxy_pass http://127.0.0.1:8765/;
        proxy_http_version 1.1;
        # The sidecar's TrustedHostMiddleware only accepts loopback hosts, so
        # forward a loopback Host rather than the public $host (which would be
        # rejected as a rebinding attempt).
        proxy_set_header Host 127.0.0.1;
        # Authenticate the proxy to the sidecar. entrypoint.sh substitutes the
        # per-container token here (and exports the same value to uvicorn). The
        # browser never holds this secret; nginx is the trusted caller.
        proxy_set_header X-GeoLibre-Token "__GEOLIBRE_SIDECAR_TOKEN__";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 600s;
    }

    # The self-hosted JupyterLite site behind the Notebook panel, which is a
    # separate app embedded in an iframe and needs its own policy.
    #
    # ^~ so this wins over the static-asset regex location below and every
    # request under the prefix is handled here, documents and assets alike --
    # which is also why the immutable-asset policy has to be restated for it
    # (see $geolibre_jupyterlite_cache at the top of this file).
    #
    # The panel's iframe always requests a path under the prefix, but a bare
    # /jupyterlite typed by hand would otherwise miss this block and hit the SPA
    # fallback, reproducing the very bug below.
    location = /jupyterlite {
        # Relative Location, so a TLS reverse proxy in front of the container
        # does not see the redirect point back at http:// on the listen port.
        absolute_redirect off;
        return 301 /jupyterlite/;
    }

    location ^~ /jupyterlite/ {
        # No SPA fallback. `try_files $uri /index.html` in `location /` is what
        # turned "JupyterLite was never built" into "the Notebook panel shows a
        # second copy of GeoLibre": the iframe asks for
        # /jupyterlite/lab/index.html, nginx cannot find it, and answers with the
        # app. A 404 says what actually went wrong (GeoLibre#1851).
        try_files $uri $uri/ =404;

        # add_header does not inherit into a block that sets any header of its
        # own, so the shared three are repeated rather than silently dropped.
        # Cache-Control is per-request here: the site's content-hashed assets get
        # the immutable policy and everything else revalidates (see the map at
        # the top of this file).
        add_header Cache-Control $geolibre_jupyterlite_cache always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # The app policy plus 'unsafe-inline' for script-src, scoped to this
        # prefix so the app itself keeps forbidding inline script. JupyterLab
        # bootstraps from an inline <script>; under the app policy the site loads
        # its HTML and then never boots -- no shell, no launcher, just the
        # noscript fallback -- with a single "Executing inline script violates..."
        # violation and no other symptom. Nothing here needs the Google or Clerk
        # origins, so they are left out.
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: data: blob:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' blob: 'unsafe-eval' 'wasm-unsafe-eval' https://cdn.jsdelivr.net/npm/ https://cdn.jsdelivr.net/pyodide/; worker-src blob: 'self'" always;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Closely mirrors the Tauri desktop CSP. 'unsafe-eval' is required by the
        # @google/earthengine and maplibre-gl-geoagent bundles; connect-src
        # stays broad because users connect to arbitrary tile/WMS endpoints.
        # The http://localhost:* / http://127.0.0.1:* (and ws:// equivalents)
        # allowances let users load PMTiles/COGs and other local test data from
        # a dev server on another port (e.g. http://localhost:8081) even though
        # the app itself is served from a different origin (issue #387). NOTE:
        # this Docker image is intended for local/single-user use. If it is ever
        # deployed to a shared or internet-facing host, the localhost allowances
        # let the served JS probe each visitor's own loopback (from the browser,
        # localhost is the visitor's machine, not the server) -- drop them if
        # you publish the image publicly.
        # The jsDelivr script-src allowances are path-scoped: /npm/ covers
        # maplibre-gl-vector's DuckDB-WASM + geojson-vt/vt-pbf (Add Vector
        # Layer) loaded via dynamic import()/importScripts(), and /pyodide/
        # covers the Pyodide vector engine.
        # __GEOLIBRE_COLLAB_CONNECT_SRC__ is replaced at boot by entrypoint.sh with
        # the origin of GEOLIBRE_COLLAB_URL (empty when unset), so a self-hosted
        # relay is reachable without editing this file. connect-src has a bare
        # `https:` but no bare `wss:`, so a custom relay would otherwise pass the
        # entrypoint's validation, be advertised in the UI, and then have its
        # WebSocket blocked here.
        # When adding or removing a *named* host from any CSP directive (e.g. a
        # collaboration server in connect-src, or a new CDN in script-src),
        # mirror the change in the Tauri CSP in
        # apps/geolibre-desktop/src-tauri/tauri.conf.json as well --
        # wss://collab.geolibre.app is an example of a host duplicated in both.
        # `data:` must stay in connect-src in BOTH CSPs: MapLibre fetches an
        # image source's URL (it does not assign it to an <img>), so a data:
        # URI image -- a KML/KMZ <GroundOverlay>, a deck.gl icon atlas -- is
        # matched against connect-src, not img-src. Dropping it makes those
        # layers fail to load with an opaque "Load failed" (issue #1463).
        # __GEOLIBRE_CLERK_SCRIPT_SRC__/__GEOLIBRE_CLERK_FRAME_SRC__ are likewise
        # replaced at boot with the Clerk Frontend API host encoded in
        # GEOLIBRE_CLERK_PUBLISHABLE_KEY plus Clerk's fixed bot-protection origins
        # (empty when unset). __GEOLIBRE_AUTH0_FRAME_SRC__ is the same idea for the
        # alternative Auth0 gate: GEOLIBRE_AUTH0_DOMAIN, which the SDK opens in a
        # hidden iframe for silent authentication. Auth0 needs no script-src entry
        # (its SDK is bundled) and its token endpoint is covered by the bare
        # `https:` in connect-src. These are deliberately NOT mirrored to the Tauri
        # CSP: the sign-in gate is compiled out of the desktop and embed builds
        # (main.tsx gates it on the build target), so neither provider loads there.
        # The Tauri CSP additionally allows http://127.0.0.1:* / http://localhost:*
        # in frame-src/child-src so the desktop app can embed its locally
        # launched JupyterLab server in the Notebook panel. That is desktop-only
        # and intentionally NOT mirrored here: the web build embeds the
        # same-origin self-hosted JupyterLite site, already covered by 'self'.
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: data: blob: http://127.0.0.1:* http://localhost:* wss://collab.geolibre.app__GEOLIBRE_COLLAB_CONNECT_SRC__ ws://127.0.0.1:* ws://localhost:*; img-src 'self' data: blob: https:; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' blob: 'unsafe-eval' 'wasm-unsafe-eval' https://cdn.jsdelivr.net/npm/ https://cdn.jsdelivr.net/pyodide/ https://accounts.google.com__GEOLIBRE_CLERK_SCRIPT_SRC__; child-src 'self' https://accounts.google.com https://www.google.com; frame-src 'self' https://accounts.google.com https://www.google.com__GEOLIBRE_CLERK_FRAME_SRC____GEOLIBRE_AUTH0_FRAME_SRC__; worker-src blob: 'self'" always;
    }

    # The service worker has a stable filename, so it must always revalidate;
    # otherwise the immutable asset rule below would pin an old worker for a year
    # and the autoUpdate flow could never pick up a redeploy. (Workbox's own
    # runtime chunk, workbox-<hash>.js, is content-hashed and safely immutable.)
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # nginx's default mime.types has no entry for .webmanifest; serve it with the
    # correct type and let it revalidate (it is small and changes on redeploys).
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Deployment-time public configuration generated by entrypoint.sh. It
    # contains only the same-origin AI route and model, never the proxy token.
    location = /geolibre-runtime-config.js {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Bundled plugin entries live under fixed paths like
    # /plugins/nasa-opera/dist/index.js. They are not content-hashed, so they
    # must revalidate on every deployment instead of inheriting the immutable
    # asset rule below.
    location ^~ /plugins/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|ico|svg|webp|avif|wasm|woff2?|ttf|otf)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
